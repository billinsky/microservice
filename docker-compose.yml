services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  discovery-server:
    build: ./backend/discovery-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  config-server:
    build: ./backend/config-server
    ports:
      - "8888:8888"
    depends_on:
      - discovery-server
    environment:
      - SPRING_PROFILES_ACTIVE=native,docker

  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
      - config-server
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888

  client-service:
    build: ./backend/client-service
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      - mongodb
      - discovery-server
      - config-server
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/clientdb
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888

  order-service:
    build: ./backend/order-service
    ports:
      - "8082:8082"
    depends_on:
      - mongodb
      - discovery-server
      - config-server
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/orderdb
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - GRPC_CLIENT_CLIENT_SERVICE_ADDRESS=static://client-service:9091

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  mongodb_data:
